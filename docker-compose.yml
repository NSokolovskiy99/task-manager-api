services:
  postgres:
    profiles:
      - docker-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: task_manager
      POSTGRES_PASSWORD: task_manager
      POSTGRES_DB: task_manager
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_manager -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    # Пароли зашиты прямо здесь — чтобы работало без .env
    environment:
      DATABASE_MODE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: task_manager
      DB_PASSWORD: task_manager
      DB_NAME: task_manager
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pg_data: