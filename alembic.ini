# Универсальная конфигурация для одной БД.

[alembic]
# путь к скриптам миграций (относительно этого файла)
script_location = %(here)s/alembic

# шаблон имени файла миграции; по умолчанию %%(rev)s_%%(slug)s
# file_template = %%(rev)s_%%(slug)s

# пути в sys.path (по умолчанию — текущая директория)
prepend_sys_path = .

# часовой пояс для дат в файлах миграций
# timezone =

# максимальная длина "slug" в имени файла
# truncate_slug_length = 40

# разделитель путей (os — системный)
path_separator = os

# URL подключения к БД.
# ВАЖНО: alembic/env.py переопределяет это значение из core.config.settings
# в зависимости от DATABASE_MODE (.env): "postgres" -> PostgreSQL, иначе -> SQLite.
# Строка ниже остаётся только как fallback.
sqlalchemy.url = sqlite+aiosqlite:///tasks.db


[post_write_hooks]
# хуки, выполняемые после генерации файла миграции
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


# настройки логирования
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
