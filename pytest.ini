[pytest]
addopts =
    -v
    -ra
    --strict-markers
    --cov=services
    --cov=routers
    --cov=utils
    --cov=schemas
    --cov=models
    --cov-report=term-missing
    --cov-report=html

testpaths = tests

markers =
    smoke: Дымовые тесты для критического функционала
    regression: Полный набор регрессионных тестов
    slow: Медленные тесты
    api: Тесты API
    database: Тесты, требующие доступа к БД
    unit: Unit-тесты (с mock)
    integration: Интеграционные тесты (с реальной БД)